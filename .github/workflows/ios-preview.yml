name: Gaoming TV iOS Release compile

on:
  push:
    branches: [codex/ios-preview-xcode26]

permissions:
  contents: read

concurrency:
  group: gaoming-tv-ios-preview-release-check
  cancel-in-progress: true

jobs:
  playback:
    runs-on: macos-26-intel
    timeout-minutes: 12
    env:
      TZ: Asia/Shanghai
      IOS_PREVIEW_DOWNLOAD_RUNTIME: '1'
    steps:
      - name: Check out the requested source revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SAVE_DATE=%s\n' "$(date +%F)" >> "$GITHUB_ENV"
      - name: Select the latest stable installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path

          versions = []
          for path in Path('/Applications').glob('Xcode_*.app'):
              found = re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app', path.name)
              if found:
                  parts = tuple(int(part) for part in found[1].split('.'))
                  versions.append((parts, path))
          if versions:
              print(f'DEVELOPER_DIR={max(versions)[1] / "Contents/Developer"}')
          PY
      - name: Compile the unsigned iOS Release for a generic device
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          out="$RUNNER_TEMP/gaoming-ios-test"
          mkdir -p "$out"
          xcodebuild -project ios/GaomingTV.xcodeproj -scheme GaomingTV -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/gaoming-device" \
            CODE_SIGNING_ALLOWED=NO build > "$out/release-build_$SAVE_DATE.log" 2>&1 || {
              tail -n 140 "$out/release-build_$SAVE_DATE.log"; exit 1;
            }
          app="$RUNNER_TEMP/gaoming-device/Build/Products/Release-iphoneos/GaomingTV.app"
          plist="$app/Info.plist"
          plutil -lint "$plist"
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion UIDeviceFamily; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$plist"
          done
          test -f "$app/public-network.m3u"
          test -f "$app/Assets.car"
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$plist" >/dev/null 2>&1; then exit 1; fi
          tail -n 3 "$out/release-build_$SAVE_DATE.log"
      - name: Save the Release build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gaoming-tv-ios-release-check_${{ env.SAVE_DATE }}
          path: ${{ runner.temp }}/gaoming-ios-test/
          retention-days: 14
          if-no-files-found: warn
